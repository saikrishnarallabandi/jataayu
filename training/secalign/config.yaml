# SecAlign DPO config for jataayu Layer 2.
# House rules: fp16 (NOT bf16 — bf16 destabilizes DPO log-probs), QLoRA for 8B on consumer GPUs,
# log to wandb.

base_model: Qwen/Qwen3-8B
output_dir: exp/secalign-qwen3-8b
data_file: data/secalign_dpo.jsonl

# DPO
beta: 0.1
learning_rate: 5.0e-6
num_train_epochs: 1
per_device_train_batch_size: 1
gradient_accumulation_steps: 16
max_length: 1024
max_prompt_length: 768

# QLoRA
load_in_4bit: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# precision
fp16: true
bf16: false

# logging
wandb_project: jataayu-secalign
logging_steps: 10
save_steps: 200
seed: 42
