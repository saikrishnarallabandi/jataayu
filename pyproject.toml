[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jataayu"
version = "0.3.1"
description = "Deterministic action authorization for AI agents — gate the effect, not the string. Optional SLM injection detection as defense in depth."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
keywords = ["ai-security", "prompt-injection", "privacy", "llm", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
dependencies = [
    "requests>=2.31",
    "pyyaml>=6",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.25",
    "openai>=1.0",
]
ollama = [
    "ollama>=0.1",
]
gateway = [
    "aiohttp>=3.9",
]
dev = [
    "build>=1.2",
    "pytest>=7",
    "pytest-timeout>=2.1",
    # Pinned to a minor, not floated. ruff is a merge GATE, not an ordinary dependency: it
    # renders verdicts, so a release can turn CI red with no commit behind it. `>=0.2.0` already
    # did that once when 0.16 broadened the default rule set (487 errors), and again through the
    # FORMATTER — 0.11 and 0.16 disagree on redundant parens, so `ruff format` run locally
    # produced output CI rejected. Selecting the lint rules fixed only half of that; the
    # formatter has no equivalent knob, so the version itself has to be pinned. Bump deliberately.
    "ruff>=0.16,<0.17",
    # the MCP gateway's server tests drive a real aiohttp server; without this
    # they cannot run, which is how the gateway once shipped unable to serve.
    "aiohttp>=3.9",
]

[project.scripts]
jataayu = "jataayu.integrations.cli:main"

[project.urls]
Homepage = "https://saikrishnarallabandi.github.io/jataayu/"
Repository = "https://github.com/saikrishnarallabandi/jataayu"
Issues = "https://github.com/saikrishnarallabandi/jataayu/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["jataayu*"]

[tool.ruff]
line-length = 100
target-version = "py310"

# Pin the rule set explicitly. CI installs `ruff>=0.2.0`, so it picks up whatever ruff is
# newest at job time; 0.16.0 broadened the implicit default beyond E4/E7/E9/F and turned
# main red with 487 errors across 12 rule families nobody opted into. These four codes are
# exactly what the implicit default resolved to before, so this changes no verdict on any
# current file — it just stops a ruff release from redefining the standard for us.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slowest test is 0.50s locally; the slowest legitimate path is a gateway test
# exhausting its own 5s bind wait plus a 5s join. 60s clears that by 4x on a
# cold CI runner and still fails ~10x inside the job's timeout-minutes, so a
# hang produces a stack trace instead of a silent 6-hour burn. The thread
# method (not signal) is required: signal cannot interrupt a thread blocked in
# a socket call, and thread dumps every thread's stack, which is where the
# gateway tests would wedge.
timeout = 60
timeout_method = "thread"

[tool.ruff.lint.per-file-ignores]
"benchmarks/**/*.py" = ["E402"]
"training/**/*.py" = ["E402"]
"benchmarks/agentdojo/summarize_slice.py" = ["E702", "E731"]
"benchmarks/run_detector_headtohead.py" = ["E741"]
"benchmarks/run_injecagent_bench.py" = ["E741"]
"benchmarks/run_memory_poison_bench.py" = ["E741"]
"benchmarks/run_slowpath_bench.py" = ["E702", "E741"]
"demo/verify_space_scoring.py" = ["E402"]
# Data-build and analysis scripts. `for l in open(f)` (E741) and `import x; import y` (E702) are
# the house idiom throughout them, already conceded per-file for train_lora.py and four benchmark
# runners above. Globbed rather than fixed because these scripts ARE the provenance record for the
# shipped v0.1 adapter — one is named .FROZEN.py — and renaming variables inside them to satisfy a
# style rule buys nothing and obscures what produced the released weights.
"benchmarks/qwen_injection/*.py" = ["E702", "E741"]
"training/injection_adapter/code/*.py" = ["E702", "E741"]
"training/injection_adapter/eval/run_cfp_notinject.py" = ["E741"]
"training/injection_adapter/eval/score_decoder_lora.py" = ["E741"]
