# Jataayu Policy Configuration Example
# =====================================
# Place as jataayu-policy.yml in your project root, or point to it with:
#   JATAAYU_POLICY_FILE=/path/to/jataayu-policy.yml
#
# Usage in Python — the outbound privacy keys below are read straight off this file:
#   from jataayu import jataayu_check_outbound
#   jataayu_check_outbound(draft, surface="discord-channel",
#                          policy_file="jataayu-policy.yml", agent="privacy-bot")
#
# Or load it yourself:
#   from jataayu.config.policy import load_policy
#   policy = load_policy("jataayu-policy.yml")
#   agent_policy = policy.get_agent_policy("my-agent")
#   config = agent_policy.to_privacy_config()  # for OutboundGuard
#
# Every key below is read by a guard at runtime. Keys that are NOT policy-settable are
# rejected at load with a message pointing at the real source of truth, rather than being
# parsed and ignored — see the note at the bottom of this file for the full list.

version: 1                    # Must be 1. An unknown version is a load error.

# Global defaults — applied to all agents unless overridden per-agent, and used on their
# own when a call names no agent (or names one that is not listed below).
defaults:
  check_credentials: true     # Scan outbound content for leaked credentials
  check_high_entropy: false   # Entropy-based secret detection (more FPs)

  # Every key an agent block accepts may be written here, and an agent that omits it
  # inherits this value. Your org-wide roster and codename lists belong here — written
  # once, they apply to every agent, to a call that names no agent, and to a call that
  # misspells one.
  protected_names: []         # Names that must never appear in outbound content
  internal_codenames: []      # Blocked on every surface
  gtm_codenames: []           # Allowed on github/public, held on social surfaces
  disabled_cred_rules: []     # Credential rule IDs to switch off (e.g. CRED_004)

# Per-agent policies
agents:

  # Effect-boundary configuration — measure before you enforce.
  #
  #   from jataayu import jataayu_authorize_action
  #   jataayu_authorize_action("shell.exec", {...}, policy_file="jataayu-policy.yml",
  #                            agent="prod-agent")
  #
  # In observe mode the returned `decision` is 'allow' (nothing is blocked) while
  # `would_decision` carries the truthful verdict — so you can measure your own
  # false-positive rate on real traffic, then flip mode to `enforce`.
  prod-agent:
    mode: observe                  # "enforce" (block) | "observe" (measure only)
    strict_unknown_tools: false    # true = untrusted calls to unknown tool names need approval
    # Your real tool inventory. Overrides the built-in name classifier, so this is
    # also how you fix a false positive on one of your own tool names.
    # The override also outranks allowed_capabilities/forbidden_capabilities: mapping a
    # tool to `read` gives it the fs_read capability, so a `forbidden: [exec]` list no
    # longer applies to that name. Deliberate — the map is your ground truth for the
    # tools you name — but it means a wrong entry here silently widens the policy.
    # Valid effects: read, memory_write, file_write, network, secret_read,
    #                shell, code_eval
    # `none` is deliberately NOT accepted here. It carries no capability tag and sits
    # outside every critical/approval set, so mapping a tool to it would disable the
    # boundary for that name entirely — including forbidden_capabilities. `read` is the
    # least restrictive value you can set, and it still applies capability checks.
    tool_effects:
      jira.create_issue: network
      internal.run_playbook: shell
      db.query: read

  # A coding agent (Cline, Claude Code, Cursor, etc.)
  # These agents read GitHub issues, PRs, and web pages — high Clinejection risk
  coding-agent:
    protected_names: []
    check_credentials: true      # Catch leaked secrets in output
    check_high_entropy: false
    # Capability isolation, enforced by jataayu_check_skillset() at install time.
    forbidden_capabilities: [exec]

  # A GitHub bot (reads issues, comments, sends responses)
  github-bot:
    protected_names: []
    check_credentials: true

  # A WhatsApp/messaging assistant that handles family context
  privacy-bot:
    # List names that should NEVER appear in group chat responses
    protected_names:
      - Alice                     # Children's names
      - Bob
      - "Your Child's Name"
    check_credentials: false     # WhatsApp bot doesn't handle code/secrets

  # An internal-only agent (loose restrictions)
  internal-agent:
    check_credentials: false

# ---------------------------------------------------------------------------
# NOT policy-settable — writing any of these is a load error, not a silent no-op.
# ---------------------------------------------------------------------------
#
# Surface behaviour: the top-level `surfaces:` block, per-agent `surface_overrides:`,
# and `allowed_surfaces:`. Surface profiles (trust_level, inbound_strict,
# outbound_strict, risk_multiplier) are a fixed table in jataayu/surfaces/profiles.py
# — SURFACE_PROFILES — and that table is what the guards actually read. No guard has
# ever consulted a per-agent surface allowlist.
#
# Guard thresholds: `block_threshold`, `llm_threshold`, `use_llm`. These are
# constructor/keyword arguments on the guard itself:
#   InboundGuard(use_llm=..., llm_threshold=...)
#   OutboundGuard(PrivacyConfig(block_threshold=..., llm_threshold=..., use_llm=...))
#   SkillVetGuard(block_threshold=...)
#   MCPGateway(block_threshold=..., llm_threshold=..., use_llm=...)
#   jataayu_check_inbound(..., use_llm=True) / jataayu_check_outbound(..., use_llm=True)
# A policy file must not be able to switch on a network call or move a block line.
#
# Both groups may become policy-settable later. Until then the loader raises and names
# the real source of truth, rather than accepting a value nothing would read.
